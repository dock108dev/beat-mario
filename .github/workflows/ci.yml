name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node for JavaScript regression tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.10"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development dependencies
        run: uv sync --locked --all-extras

      - name: Run canonical repository gate
        id: validate
        env:
          PYTEST_ADDOPTS: --junitxml=${{ runner.temp }}/test-results/junit.xml
        run: PYTHON=.venv/bin/python scripts/validate_phase0.sh

      - name: Summarize validation
        if: ${{ always() && !cancelled() && hashFiles('scripts/ci_report.py') != '' }}
        env:
          GATE_OUTCOME: ${{ steps.validate.outcome }}
        run: >-
          python3 scripts/ci_report.py
          --report "${{ runner.temp }}/test-results/junit.xml"
          --output-dir "${{ runner.temp }}/test-results"
          --summary "$GITHUB_STEP_SUMMARY"
          --gate-outcome "$GATE_OUTCOME"

      - name: Retain test results
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-test-results
          path: |
            ${{ runner.temp }}/test-results/junit.xml
            ${{ runner.temp }}/test-results/metrics.json
            ${{ runner.temp }}/test-results/summary.md
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
