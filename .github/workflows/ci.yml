name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '[{"check":"verify","os":"ubuntu-latest","python":"3.11"},{"check":"compatibility-macos","os":"macos-14","python":"3.14"}]' || '[{"check":"verify","os":"ubuntu-latest","python":"3.11"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node for JavaScript regression tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: minecraft-worker/.nvmrc
          package-manager-cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.9.10"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ matrix.os }}-${{ matrix.python }}

      - name: Install locked development dependencies
        run: uv sync --locked --all-extras --python "${{ matrix.python }}"

      - name: Isolate reports
        run: |
          mkdir -p "$RUNNER_TEMP/test-results"
          echo "COVERAGE_FILE=$RUNNER_TEMP/test-results/.coverage" >> "$GITHUB_ENV"

      - name: Validate Actions
        run: python3 scripts/check_actions.py

      - name: Install worker dependencies for bridge tests
        run: npm ci --prefix minecraft-worker --ignore-scripts --no-audit --no-fund

      - name: Run canonical repository gate
        id: validate
        env:
          PYTEST_ADDOPTS: --junitxml=${{ runner.temp }}/test-results/junit.xml
        run: PYTHON=.venv/bin/python scripts/validate_phase0.sh

      - name: Measure Minecraft core coverage
        id: coverage
        env:
          GAME_COMPANION_USER_DATA: ${{ runner.temp }}/coverage-profile
        run: .venv/bin/python -m coverage run --branch --source=smb3_agent.minecraft_memory,smb3_agent.minecraft_bridge,smb3_agent.minecraft_delivery,smb3_agent.minecraft_build,smb3_agent.minecraft_design -m pytest -q tests/test_minecraft_memory.py tests/test_minecraft_backend_recovery.py tests/test_minecraft_bridge.py tests/test_minecraft_delivery.py tests/test_minecraft_ssot.py tests/test_minecraft_build.py tests/test_minecraft_build_storage.py tests/test_minecraft_design.py tests/test_minecraft_terrain.py tests/test_minecraft_architecture.py

      - name: Coverage reports
        id: coverage_reports
        if: ${{ always() && !cancelled() && steps.coverage.outcome != 'skipped' }}
        run: |
          .venv/bin/python -m coverage xml -o "$RUNNER_TEMP/test-results/coverage.xml"
          .venv/bin/python -m coverage json -o "$RUNNER_TEMP/test-results/coverage.json"

      - name: Build wheel and fresh import smoke
        id: build
        run: python3 scripts/ci_build.py --report "$RUNNER_TEMP/test-results/build.json"

      - name: Weekly Python dependency audit
        id: python_audit
        if: ${{ always() && !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: python3 scripts/ci_python_audit.py --output "$RUNNER_TEMP/test-results/python-audit.json"

      - name: Summarize validation
        if: ${{ always() && !cancelled() }}
        env:
          GATE_OUTCOME: ${{ steps.validate.outcome }}
          CHECK_OUTCOMES: ${{ toJSON(steps) }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/ci_report.py
          --report "${{ runner.temp }}/test-results/junit.xml"
          --output-dir "${{ runner.temp }}/test-results"
          --summary "$GITHUB_STEP_SUMMARY"
          --gate-outcome "$GATE_OUTCOME"
          --require-check validate --require-check coverage --require-check coverage_reports --require-check build

      - name: Retain test results
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-test-results-${{ matrix.check }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/test-results/junit.xml
            ${{ runner.temp }}/test-results/metrics.json
            ${{ runner.temp }}/test-results/summary.md
            ${{ runner.temp }}/test-results/coverage.xml
            ${{ runner.temp }}/test-results/coverage.json
            ${{ runner.temp }}/test-results/build.json
            ${{ runner.temp }}/test-results/python-audit.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  minecraft-worker:
    name: minecraft-worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: minecraft-worker/.nvmrc
          package-manager-cache: false
      - name: Locked install
        run: npm ci --prefix minecraft-worker --ignore-scripts --no-audit --no-fund
      - name: Worker behavior
        id: worker
        working-directory: minecraft-worker
        run: node --test --test-reporter=junit --test-reporter-destination="$RUNNER_TEMP/worker.xml" test/*.test.cjs
      - name: Summarize worker
        if: ${{ always() && !cancelled() }}
        env:
          GATE_OUTCOME: ${{ steps.worker.outcome }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_report.py --report "$RUNNER_TEMP/worker.xml" --output-dir "$RUNNER_TEMP/worker-report" --summary "$GITHUB_STEP_SUMMARY" --gate-outcome "$GATE_OUTCOME" --scope worker
      - name: Weekly dependency audit
        if: ${{ always() && !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: python3 scripts/ci_npm_audit.py --output "$RUNNER_TEMP/worker-report/audit.json"

      - name: Retain worker reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/worker.xml
            ${{ runner.temp }}/worker-report/
          if-no-files-found: error
          retention-days: 7
