owner_boundaries:
  - owner chooses the local primary save to copy
  - owner confirms the game is opened on the disposable copy
  - owner establishes player ownership
  - owner explicitly authorizes the bounded watering task
  - owner may reclaim immediately at any time
  - owner confirms returned control after neutral handback
required_flow:
  - verify primary and disposable save isolation
  - detect one visible windowed Stardew process
  - complete a screen-only initial farm sweep
  - reconcile exact planted and already-watered crop ids
  - establish player ownership and fresh task-bound agent authorization
  - water every remaining initial crop with after-action screen confirmation
  - track energy, can units, tool uses, and refills
  - return to the visibly confirmed farmhouse entrance
  - neutralize input and return player ownership
  - reverify primary save and reconcile all required evidence
  - inspect the shared Observe conversion and freshness reasons
  - request contextual Tell and inspect typed provenance without agent input
  - start and stop one fresh-copy Show with review-only labeling
  - explicitly authorize Do in the same currently observed live session
  - exercise immediate reclaim during an active phase and verify neutral handback
  - complete a separate exact Do attempt without reusing Show authority
  - reset only the disposable copy into a fresh attempt-owned destination
  - verify reset invalidated all old observations, Tell cards, mode sessions, and authority
failure_cases_required:
  - unknown or occluded crop
  - process or window loss
  - save mismatch or primary-save risk
  - ambiguous or expired ownership
  - protected-action refusal
  - missing evidence
  - clean stopped recovery with failed attempt retained
  - stale Tell Show and Do refusal
  - reclaim during each active task phase
  - timeout cancellation and ordinary-input-driver loss
  - stale authority after copied-save reset
presentation_required: [desktop, narrow_390, current mode, availability reason, observation evidence, Tell card, Show review label, Do scope and expiry, visible input owner, reclaim, neutral handback, reset status, reconciliation, protected refusal, first failure, visible unknowns, visible recovery]
