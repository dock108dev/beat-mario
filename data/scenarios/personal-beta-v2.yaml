proof_limits:
  - A B3 pass permits B4 engineering only; full beta and owner acceptance remain separate.
  - Engineering-save isolation is not owner-save-copy validation; record the selected source class and actual load/persistence evidence.
  - A B2 pass permits the B3 engineering handoff only; it never makes the beta ready.
  - Fixtures, rendered UI and historical evidence do not satisfy visible game proof.
  - Playback speed does not establish game-frame route improvement or full completion.
  - Owner feedback and acceptance remain blank until an actual owner review.
  - No third-game onboarding completion is required by this beta contract.
