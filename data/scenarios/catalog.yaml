    owner_action_boundaries: [owner supplies and opens a disposable copied save, owner retains player input ownership]
    owner_participation_required: true
    visible_execution_required: true
    capability_status: available
    affected_process_or_save: disposable owner-provided Stardew save copy only
    allowed_inputs: []
    expected_events: [save_identity_verified, process_detected, window_detected, observation_freshness, crop_sweep_reconciled, resource_fact, position_fact, evidence_reconciled]
    negative_expectations: [no input in observation-only phase, no save or screen fact from hidden APIs, no primary-save write]
  - scenario_id: stardew.bounded_watering
