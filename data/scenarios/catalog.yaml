    adapter_version: stardew-companion/v1
    required_fixtures: [data/stardew/fixtures.yaml, data/stardew/evidence-contract.yaml]
    expected_events: [reclaim_requested, input_neutralized, handback_completed, cleanup, evidence_reconciled]
