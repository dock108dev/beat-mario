    owner_action_boundaries: [owner authorizes the bounded task on a disposable copied save, owner confirms returned control]
    owner_participation_required: true
    visible_execution_required: true
    capability_status: available
    affected_process_or_save: disposable owner-provided Stardew save copy only
    allowed_inputs: [ordinary keyboard, ordinary mouse, ordinary controller]
    protected_decisions: [purchase, sale, discard, gift, consequential dialogue, story outcome, sleep, primary save]
    expected_events: [crop_sweep_reconciled, ownership_transition, agent_input, crop_watered, resource_fact, watering_can_refilled, position_fact, input_neutralized, handback_completed, evidence_reconciled]
    negative_expectations: [no protected action, no crop completion claim without exact reconciliation, no final success away from farmhouse entrance, no primary-save write]
