schema_version: game-companion-scenario/v1
defaults:
  version: "1"
  game_id: smb3
  adapter_id: smb3
  adapter_version: smb3-live-observer/v1
  classification: deterministic_only
  evidence_classification: deterministic_fixture_result
  execution_classification: deterministic_only
  capability_requirements: [local_event_store]
  preconditions: [exact scenario and adapter versions are available, local artifact root is writable]
  required_fixtures: [data/scenarios/fixtures.yaml]
  required_local_assets: []
  owner_action_boundaries: []
  automated_steps:
    - step_id: reconcile
      actor: system
      action: reconcile fixture events and expected state without game input
      may_send_input: false
      safe_to_resume: true
  expected_events: [evidence_reconciled]
  expected_state_transitions: [defined, preflight_pending, ready, running, cleanup_pending, completed]
  negative_expectations: [no evidence classification upgrade, no owner feedback inference, no input outside authorization]
  timeout_seconds: 120
  cleanup_requirements: [neutralize any authorized input, close only scenario-owned handles, retain artifacts]
  artifact_requirements: [attempt manifest, event stream, classified report, reconciliation record]
  expected_terminal_state: completed
  visible_execution_required: false
  owner_participation_required: false
  may_count_toward_reliability: false
  may_count_toward_owner_acceptance: false
  retry_policy:
    maximum_new_attempts: 1
    retryable_terminal_states: [failed, timed_out, process_lost]
    destructive_retry: false
  failure_retention_policy: retain_complete_attempt_and_create_new_retry
  affected_process_or_save: none; fixtures only
  allowed_inputs: []
  protected_decisions: [player ownership, primary saves, accepted route evidence]
  stop_and_reclaim_behavior: stop immediately; neutralize before handback; never continue after reclaim
  expected_duration: under two minutes
  result_can_prove: [the deterministic scenario contract behaved as recorded]
  result_cannot_prove: [route reliability, owner usefulness, owner acceptance, visible live proof, authoritative game completion]
scenarios:
  - scenario_id: observation.read_only_input_free
    title: Read-only observation remains input-free
    capability_requirements: [local_event_store, read_only_observation]
    expected_events: [observation_connected, observation_freshness, evidence_reconciled]
    negative_expectations: [no agent_input, no player_input generated by Companion]
  - scenario_id: run_library.automatic_first_player_baseline
    title: Automatic first player baseline
    capability_requirements: [local_event_store, dynamic_run_library]
    expected_events: [run_created, profile_created, fastest_observed_updated, evidence_reconciled]
  - scenario_id: comparison.faster_and_slower_compatible_runs
    title: Faster and slower compatible-run comparison
    capability_requirements: [local_event_store, dynamic_run_library, compatible_comparison]
    expected_events: [comparison, fastest_observed_updated, evidence_reconciled]
  - scenario_id: coaching.on_request
    title: On-request coaching
    capability_requirements: [local_event_store, grounded_tell, goal_aware_coaching]
    expected_events: [tell_request, suggestion_emitted, suggestion_response]
  - scenario_id: coaching.proactive
    title: Proactive coaching
    capability_requirements: [local_event_store, goal_aware_coaching]
    expected_events: [coaching_policy, suggestion_emitted, suggestion_suppressed]
  - scenario_id: show.separate_review_only
    title: Show remains separate
    classification: review_only
    evidence_classification: review_only_show_result
    execution_classification: review_only
    capability_requirements: [local_event_store, show_review]
    expected_events: [show_started, show_stopped, evidence_reconciled]
    result_can_prove: [review-only Show lifecycle and artifact reconciliation]
  - scenario_id: learning.candidate_derivation_review
    title: Candidate derivation and review
    capability_requirements: [local_event_store, adaptive_learning]
    expected_events: [learning_pattern, candidate_reviewed, evidence_reconciled]
  - scenario_id: learning.candidate_rejection
    title: Candidate rejection
    capability_requirements: [local_event_store, adaptive_learning]
    expected_events: [candidate_reviewed, candidate_rejected]
  - scenario_id: learning.validation_failure
    title: Candidate validation failure
    capability_requirements: [local_event_store, adaptive_learning]
    expected_events: [candidate_promotion_state, failure, cleanup]
    expected_terminal_state: retained_for_review
  - scenario_id: learning.promotion_preparation
    title: Promotion preparation
    capability_requirements: [local_event_store, adaptive_learning, route_patch_preparation]
    expected_events: [candidate_promotion_state, evidence_reconciled]
    negative_expectations: [no promotion execution, no accepted route modification]
  - scenario_id: learning.rollback_preparation
    title: Rollback preparation
    capability_requirements: [local_event_store, adaptive_learning, route_patch_preparation]
    expected_events: [candidate_promotion_state, evidence_reconciled]
    negative_expectations: [no rollback execution, no accepted route modification]
  - scenario_id: takeover.current_session
    title: Current-session takeover
    classification: owner_required
    evidence_classification: visible_live_result
    execution_classification: owner_required
    capability_requirements: [local_event_store, live_takeover]
    owner_action_boundaries: [owner explicitly authorizes bound scope in the visible current process]
    automated_steps:
      - step_id: authorize
        actor: system
        action: validate current-process authorization and transfer only after owner action
        may_send_input: false
      - step_id: bounded_control
        actor: agent
        action: send only authorized inputs until stop, reclaim, or terminal failure
        may_send_input: true
    expected_events: [takeover_authorized, agent_control_started, agent_input, input_neutralized, handback_completed]
    owner_participation_required: true
    visible_execution_required: true
    affected_process_or_save: owner's visible current Mario process; no save mutation
    allowed_inputs: [accepted solution inputs within authorization]
  - scenario_id: takeover.immediate_reclaim
    title: Immediate reclaim
    classification: owner_required
    evidence_classification: visible_live_result
    execution_classification: owner_required
    capability_requirements: [local_event_store, live_takeover, immediate_reclaim]
    owner_action_boundaries: [owner authorizes takeover, owner requests immediate reclaim]
    automated_steps:
      - step_id: bounded_control
        actor: agent
        action: check reclaim before every frame and neutralize immediately
        may_send_input: true
    expected_events: [takeover_authorized, agent_control_started, reclaim_requested, input_neutralized, handback_completed]
    owner_participation_required: true
    visible_execution_required: true
    affected_process_or_save: owner's visible current Mario process; no save mutation
  - scenario_id: takeover.timeout
    title: Takeover timeout
    capability_requirements: [local_event_store, live_takeover]
    expected_events: [takeover_authorized, failure, input_neutralized, handback_completed, cleanup]
    expected_terminal_state: timed_out
  - scenario_id: takeover.cancellation
    title: Takeover cancellation
    capability_requirements: [local_event_store, live_takeover]
    expected_events: [takeover_authorized, input_neutralized, handback_completed, cleanup]
    expected_terminal_state: cancelled
  - scenario_id: takeover.process_loss
    title: Process loss
    capability_requirements: [local_event_store, live_takeover]
    expected_events: [process_lost, input_neutralized, cleanup]
    expected_terminal_state: process_lost
  - scenario_id: safety.unsupported_state
    title: Unsupported state
    capability_requirements: [local_event_store, read_only_observation]
    expected_events: [state_fact, failure, cleanup]
    expected_terminal_state: blocked
  - scenario_id: safety.protected_resource_conflict
    title: Protected-resource conflict
    capability_requirements: [local_event_store, live_takeover]
    expected_events: [failure, input_neutralized, handback_completed]
    expected_terminal_state: blocked
  - scenario_id: mario.full_game_takeover
    title: Full-game Mario takeover
    classification: owner_required
    evidence_classification: visible_live_result
    execution_classification: owner_required
    capability_requirements: [local_event_store, live_takeover, full_game_solution]
    owner_action_boundaries: [owner authorizes full-game scope in the visible current Mario process, owner confirms returned control]
    owner_participation_required: true
    visible_execution_required: true
    affected_process_or_save: owner's visible current Mario process; protected decisions remain immutable
    allowed_inputs: [accepted full-game solution inputs within authorization]
    expected_duration: bounded by authorization timeout
  - scenario_id: mario.product_first_use
    title: Mario first-use success and failure paths
    capability_requirements: [mario_product_session, mario_first_use, adapter_capability_truth]
    required_fixtures: [data/scenarios/fixtures.yaml, data/mario/product.yaml]
    expected_events: [first_use_started, game_file_detected, game_file_selected, game_identity_verified, emulator_detected, input_readiness_confirmed, session_choice_selected, first_use_completed, configuration_failed]
    negative_expectations: [no ROM content copied, no duplicate active process, no agent input before authorization]
    result_can_prove: [first-use contracts and fail-closed setup state behave as recorded]
  - scenario_id: mario.product_workspace
    title: Compact Mario player workspace and capability truth
    capability_requirements: [mario_product_session, adapter_capability_truth, in_place_workspace]
    required_fixtures: [data/scenarios/fixtures.yaml, data/mario/product.yaml]
    expected_events: [state_fact, progress_fact, comparison, history_updated, evidence_reconciled]
    negative_expectations: [no independent UI capability claims, no hidden active reclaim, no page reload for normal actions]
    result_can_prove: [desktop and 390px workspace contracts, keyboard order, focus retention, and in-place update contracts]
  - scenario_id: mario.product_observe_tell_coaching
    title: Observe Tell and coaching product flow
    capability_requirements: [mario_product_session, read_only_observation, grounded_tell, goal_aware_coaching]
    expected_events: [session_started, observation_connected, observation_freshness, tell_request, coaching_policy, suggestion_emitted, suggestion_suppressed]
    negative_expectations: [no agent input in Observe-only session, no implied advice response, no stale-state advice]
  - scenario_id: mario.product_show_separation
    title: Show is visibly separate from the live game
    classification: review_only
    evidence_classification: review_only_show_result
    execution_classification: review_only
    capability_requirements: [mario_product_session, show_review]
    expected_events: [show_started, show_stopped, evidence_reconciled]
    negative_expectations: [no live-game ownership claim, no player completion claim, no live reclaim label on Show stop]
  - scenario_id: mario.product_do_reclaim_handback
    title: Do preflight active reclaim and safe handback presentation
    capability_requirements: [mario_product_session, live_takeover, immediate_reclaim]
    expected_events: [takeover_authorized, ownership_transition, agent_control_started, reclaim_requested, input_neutralized, handback_completed, history_updated]
    negative_expectations: [no conflicting authorization while active, no completion before game-owned proof and handback, no input after handback]
  - scenario_id: mario.product_history_learning_recovery
    title: History learning clarity failures and recovery
    capability_requirements: [mario_product_session, dynamic_run_library, adaptive_learning, local_event_store]
    expected_events: [run_created, fastest_observed_updated, learning_pattern, candidate_reviewed, candidate_rejected, failure, recovery, history_updated]
    negative_expectations: [no world-record claim, no candidate called executable, no approval called promotion, no deferred validation called passed]
  - scenario_id: mario.product_persistence_security
    title: Safe persistence and protected local actions
    capability_requirements: [mario_product_session, local_event_store, live_takeover]
    expected_events: [evidence_reconciled, recovery, cleanup]
    negative_expectations: [no expired authorization restored, no active epoch restored, no stale process ownership restored, no reclaim state restored, no write capability restored without fresh process verification, no remote request]
  - scenario_id: mario.owner_pilot_manifest
    title: Mario owner-pilot manifest completeness
    capability_requirements: [mario_product_session, mario_owner_pilot_manifest]
    required_fixtures: [data/scenarios/mario-owner-pilot.yaml]
    expected_events: [owner_feedback_prompted, owner_usefulness_feedback, owner_acceptance_decision, evidence_reconciled]
    negative_expectations: [no populated owner feedback before pilot, no simulated acceptance, no patching during attempt]
    result_can_prove: [pilot manifest completeness and blank owner decision fields]
    result_cannot_prove: [owner usefulness, owner acceptance, live product behavior]
  - scenario_id: stardew.visible_observation
    title: Stardew visible observation
    classification: owner_required
    evidence_classification: visible_live_result
    execution_classification: owner_required
    game_id: stardew_valley
