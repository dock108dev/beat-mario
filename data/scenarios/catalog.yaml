    expected_events: [state_fact, progress_fact, ownership_transition, failure, recovery, evidence_reconciled]
    negative_expectations: [no hidden unknown, no enabled mode control before readiness, no Show classification ambiguity, no hidden reclaim]
  - scenario_id: stardew.owner_pilot_manifest
