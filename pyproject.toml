[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smb3-route-agent"
version = "0.1.0"
description = "Game Companion Mario adapter and reliability harness"
requires-python = ">=3.11"
dependencies = [
  "mss>=10.2.0; sys_platform == 'darwin'",
  "numpy>=2.0.0",
  "Pillow>=12.0.0",
  "pyautogui>=0.9.54; sys_platform == 'darwin'",
  "pyobjc>=12.2.1; sys_platform == 'darwin'",
  "PyYAML>=6.0.0",
  "rich>=13.0.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.12.0",
]

[project.scripts]
smb3-agent = "smb3_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
